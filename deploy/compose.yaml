# Food Buddy stack. Same file on every host (Oracle primary, Jetson standby); differences live in .env.
#   docker compose --profile ai --profile tunnel up -d     # Oracle: everything incl. model + tunnel
#   docker compose up -d                                   # standby: no model, no tunnel
name: food-buddy

x-api: &api
  image: ${API_IMAGE:-ghcr.io/tomi-trost/food-buddy-api:latest}
  build: ../api
  restart: unless-stopped
  env_file: [{ path: .env, required: false }]
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-food}:${POSTGRES_PASSWORD:-food}@db:5432/${POSTGRES_DB:-food}
    PHOTO_DIR: /data/photos
  volumes:
    - photos:/data/photos

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-food}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-food}
      POSTGRES_DB: ${POSTGRES_DB:-food}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *api
    command: sh -c "alembic upgrade head && python -m app.nutrition.seed && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    <<: *api
    command: procrastinate --app=app.jobs.jobs_app worker
    depends_on:
      api: { condition: service_healthy } # api runs the migrations

  caddy:
    image: ${WEB_IMAGE:-ghcr.io/tomi-trost/food-buddy-web:latest}
    build: ../web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80" # local only; public traffic comes through the tunnel
    depends_on:
      api: { condition: service_healthy }

  ollama:
    image: ollama/ollama:latest
    profiles: [ai]
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "-1" # keep the model in RAM (fast replies; keeps the VM from looking idle)
    volumes:
      - models:/root/.ollama

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-} # required with --profile tunnel
    depends_on: [caddy]

volumes:
  pgdata:
  photos:
  models:
