name: Images

# Manual for now. Builds linux/arm64 images (Oracle A1, Jetson, Pi) and pushes them to GHCR.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    # QEMU on x86 while the repo is private; switch to the free native `ubuntu-24.04-arm`
    # runner (and drop QEMU) once the repo is public.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/food-buddy-${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/food-buddy-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
